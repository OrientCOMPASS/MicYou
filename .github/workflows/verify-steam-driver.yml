name: Verify Steam driver install

on:
  push:
    branches: [ci/verify-steam-driver]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show elevation and clean state
        shell: pwsh
        run: |
          whoami
          whoami /groups | Select-String -Pattern 'S-1-16-12288|High Mandatory'
          $dev = Get-PnpDevice -ErrorAction SilentlyContinue | Where-Object { $_.InstanceId -like '*STEAMSTREAMINGMICROPHONE*' }
          if ($dev) { Write-Output 'PREEXISTING_DEVICE'; $dev | Format-List FriendlyName,Status,InstanceId } else { Write-Output 'CLEAN: no Steam Streaming Microphone device' }
      - name: Build dummy installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tauri-app/target/release | Out-Null
          Set-Content tauri-app/target/release/micyou.exe 'dummy'
          New-Item -ItemType Directory -Force tauri-app/src-tauri/binaries | Out-Null
          Set-Content tauri-app/src-tauri/binaries/micyou-cli-x86_64-pc-windows-msvc.exe 'dummy'
          Set-Content tauri-app/src-tauri/binaries/micyou-tui-x86_64-pc-windows-msvc.exe 'dummy'
          Push-Location tauri-app
          iscc /DMyAppVersion=2.2.0 src-tauri/installer.iss
          Pop-Location
      - name: Run installer silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem tauri-app/src-tauri/target/release/bundle/inno/*.exe | Select-Object -First 1
          Write-Output "setup=$($setup.FullName)"
          $log = Join-Path $env:TEMP 'micyou-install.log'
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$log" -Wait -PassThru
          Write-Output "installer_exit=$($p.ExitCode)"
          Write-Output '--- installer log ---'
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern 'Steam|pnputil|PowerShell|Sysnative|configure' }
          Start-Sleep -Seconds 5
          $dev = Get-PnpDevice -ErrorAction SilentlyContinue | Where-Object { $_.InstanceId -like '*STEAMSTREAMINGMICROPHONE*' }
          if ($dev) { Write-Output 'INSTALLER_CREATED_DEVICE'; $dev | Format-List FriendlyName,Status,InstanceId } else { Write-Output 'INSTALLER_NO_DEVICE' }
          Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | Where-Object { $_.FriendlyName -match 'Steam' } | Format-List FriendlyName,Status,InstanceId
      - name: Diagnose configure.ps1
        shell: pwsh
        run: |
          $ps64 = Join-Path $env:SystemRoot 'Sysnative\WindowsPowerShell\v1.0\powershell.exe'
          Write-Output "ps64=$ps64 exists=$(Test-Path $ps64)"
          Write-Output '--- 64-bit PowerShell ---'
          & $ps64 -NoProfile -ExecutionPolicy Bypass -File tauri-app/src-tauri/resources/steam-audio/configure.ps1 2>&1 | ForEach-Object { "CONFIG64: $_" }
          Write-Output "configure64_exit=$LASTEXITCODE"
          Write-Output '--- endpoint registry ---'
          Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\MMDevices\Audio\Render' -ErrorAction SilentlyContinue | ForEach-Object {
            $p = Get-ItemProperty "$($_.PSPath)\Properties" -ErrorAction SilentlyContinue
            if ($p.'{b3f8fa53-0004-438e-9003-51a46e139bfc},6' -eq 'Steam Streaming Microphone') {
              Write-Output "RENDER $($_.PSChildName)"
              $p | Format-List
            }
          }
          Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\MMDevices\Audio\Capture' -ErrorAction SilentlyContinue | ForEach-Object {
            $p = Get-ItemProperty "$($_.PSPath)\Properties" -ErrorAction SilentlyContinue
            if ($p.'{b3f8fa53-0004-438e-9003-51a46e139bfc},6' -eq 'Steam Streaming Microphone') {
              Write-Output "CAPTURE $($_.PSChildName)"
            }
          }
