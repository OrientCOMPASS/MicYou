name: Verify Feature Branch

on:
  push:
    branches: [ "ci/verify" ]
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app -> target
          cache-on-failure: true
      - name: Cargo test
        working-directory: tauri-app
        run: cargo test -p micyou-plugin -p micyou-core -p micyou-audio -p micyou-infer
      - name: Cargo clippy
        working-directory: tauri-app
        run: cargo clippy -p micyou-plugin -p micyou-core -p micyou-audio -p micyou-infer --all-targets

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: tauri-app/package.json
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.1
      - name: Install dependencies
        working-directory: tauri-app
        run: bun install --frozen-lockfile
      - name: Type-check and build frontend
        working-directory: tauri-app
        run: bun run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'liberica'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Android Debug
        run: ./gradlew :composeApp:assembleDebug --stacktrace
